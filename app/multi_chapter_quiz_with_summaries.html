            chapter8: {
                title: "Chapter 8: Valuation",
                text: `

            <p>This chapter explains how a Category III AIF values its assets, computes its Net Asset Value (NAV), and ensures transparency and fairness through various valuation techniques. The chapter covers the core concepts of NAV and the mark-to-market (MTM) process, shows how different asset classes and unit series are treated, and describes the role of independent registered valuers.</p>

            <h3>Learning Objectives</h3>
            <ul>
                <li>Understand the concepts of Net Asset Value (NAV) and the mark-to-market (MTM) process.</li>
                <li>Apply various valuation techniques for different types of assets such as:
                    <ul>
                        <li>Liquid and illiquid securities</li>
                        <li>Equity and commodity derivatives</li>
                        <li>Money market instruments and long-term fixed-income securities</li>
                    </ul>
                </li>
                <li>Compute the NAV attributable to different series or classes of units that may have differential rights.</li>
                <li>Recognize the importance and role of third-party registered valuers in ensuring fair valuation for illiquid or non-market-traded investments.</li>
            </ul>

            <h3>Net Asset Value (NAV) and Valuation Day</h3>
            <ul>
                <li><strong>NAV Definition & Frequency:</strong>
                    <ul>
                        <li>Every Category III AIF must calculate its NAV independently and disclose it to investors.</li>
                        <li>For closed-ended funds, NAV is calculated at least quarterly; for open-ended funds, it is done monthly.</li>
                        <li>When investments are solely in listed securities, the NAV may be computed daily.</li>
                    </ul>
                </li>
                <li><strong>Valuation Day:</strong>
                    <ul>
                        <li>The “Valuation Day” is predetermined and communicated in the offer documents. It is the point in time used to determine the current market value of all the fund’s assets.</li>
                        <li>For mark-to-market purposes, the NAV may also be updated on the closing day of the relevant securities market.</li>
                    </ul>
                </li>
                <li><strong>Elements in NAV Calculation:</strong>
                    <ul>
                        <li><strong>Assets:</strong> Cash and bank holdings, marketable securities (both listed and unlisted), dividends receivable, interest earned, and financial rights from derivatives.</li>
                        <li><strong>Liabilities & Expenses:</strong> Borrowings, fund expenses (including fees, administrative costs, audit fees, etc.), and operating expenses.</li>
                        <li><strong>Example:</strong> In one detailed example, Fund INC’s balance sheet provided values for listed equities from various companies, unlisted equities (valued at fair market value by an independent valuer), debt investments, mutual fund units, and cash. After subtracting liabilities such as service fees and other expenses, the NAV per unit is computed by dividing the net assets by the total number of outstanding units.</li>
                    </ul>
                </li>
            </ul>

            <h3>Classes of Units and Series NAV</h3>
            <ul>
                <li><strong>Differential Rights & Unit Classes:</strong>
                    <ul>
                        <li>A fund may have more than one class of units (for example, Class A, B, C, etc.) to accommodate different investor groups (institutional, sponsor, employees, or related parties) and to implement varying fee structures.</li>
                        <li>For example, classes may be differentiated by the committed capital range and associated management fee rates.</li>
                    </ul>
                </li>
                <li><strong>Series within a Class:</strong>
                    <ul>
                        <li>Within the same class of units, the fund may issue different “series” to distinguish between investors entering at different times or under different fee terms.</li>
                        <li><strong>Series NAV:</strong> The NAV for each series is computed separately by allocating the fund’s assets, liabilities, and expenses (including set‑up costs, management fees, and other operating expenses) proportionally based on the investor’s contribution.</li>
                        <li><strong>Example:</strong> An example demonstrates how assets and liabilities are allocated on a pro‑rata basis and then how the net assets “attributable” to a series are divided by the number of units in that series to obtain the Series NAV, rounded to four decimal places.</li>
                    </ul>
                </li>
            </ul>

            <h3>Valuation Techniques for Different Asset Classes</h3>
            <h4>A. Liquid vs. Illiquid Securities</h4>
            <ul>
                <li><strong>Liquid Securities:</strong>
                    <ul>
                        <li>Valued at the closing market price on a recognized exchange as on the Valuation Day.</li>
                        <li>High trading volumes allow for reliable use of market quotes.</li>
                    </ul>
                </li>
                <li><strong>Illiquid Securities:</strong>
                    <ul>
                        <li>For investments where an active market does not exist (for example, shares of an SME or thinly traded companies), the initial cost is used and then an independent registered valuer assesses the “fair market value.”</li>
                        <li>Often, methods such as discounted future cash flows or other cost-based approaches (such as amortized cost) are used.</li>
                        <li><strong>Example:</strong> In one scenario, an SME’s share price that is actively traded normally at Rs. 25 per share is adjusted downward (to, for instance, Rs. 24.24 per share) after considering the impact of selling a large block over several trading days due to low liquidity.</li>
                    </ul>
                </li>
            </ul>

            <h4>B. Valuation of Derivatives and Mark-to-Market (MTM)</h4>
            <ul>
                <li><strong>MTM Process:</strong>
                    <ul>
                        <li>For securities such as futures or options, the derivatives positions are “marked-to-market” on each valuation day.</li>
                        <li>This step ensures that the current (fair) value, based on the latest available market prices, is used both for performance monitoring and to determine the correct incentive fee (performance fee) calculation.</li>
                    </ul>
                </li>
                <li><strong>Valuation Methodology:</strong>
                    <ul>
                        <li>For futures, the initial contract price is noted on the trade date (T-day), and updated settlement prices are used subsequently.</li>
                        <li>Options may be valued using models like Black‑Scholes along with the mark‑to‑market adjustment.</li>
                    </ul>
                </li>
                <li><strong>Leverage and Exposure:</strong>
                    <ul>
                        <li>Total exposure from derivative positions is computed by summing the market values of long and short positions (with appropriate offsets when possible).</li>
                        <li>The leverage ratio is then defined as the ratio of total (net) exposure to the fund’s NAV, with SEBI requiring that leverage should not exceed 2× NAV.</li>
                    </ul>
                </li>
                <li><strong>Examples in the Chapter:</strong>
                    <ul>
                        <li>One example shows Fund INC’s asset re‑evaluation after price changes in listed equities and derivatives, resulting in an updated NAV.</li>
                        <li>A further example details the computation of derivative exposures, the subsequent mark‑to‑market profit (or loss), and how this affects the margin account and overall fund leverage.</li>
                    </ul>
                </li>
            </ul>

            <h4>C. Money Market and Fixed-Income Instruments</h4>
            <ul>
                <li><strong>Money Market Instruments:</strong>
                    <ul>
                        <li>Instruments such as Treasury Bills, Certificates of Deposit, and Commercial Papers are valued using methods like the Volume‑Weighted Average Price (VWAP) of trades.</li>
                    </ul>
                </li>
                <li><strong>Fixed-Income Securities:</strong>
                    <ul>
                        <li>Long-term debt instruments (government securities and corporate bonds) are usually valued on a mark‑to‑market basis, using closing prices from recognized platforms.</li>
                        <li>When there is no recent market data, the amortized cost plus any accrued interest is used.</li>
                    </ul>
                </li>
            </ul>

            <h3>Computation of NAV for a Series Versus Fund NAV</h3>
            <ul>
                <li><strong>Overall Fund NAV vs. Series NAV:</strong>
                    <ul>
                        <li>The overall NAV for the fund represents the total net assets after subtracting liabilities, divided by the total number of units.</li>
                        <li>When a fund offers different classes or series of units, the overall assets, liabilities, and expenses are allocated proportionately.</li>
                        <li>Each series’ (or unit class’s) NAV is computed by dividing its allocated net assets by the number of units issued in that series.</li>
                    </ul>
                </li>
                <li><strong>Important Considerations:</strong>
                    <ul>
                        <li>This approach allows the fund to provide differential returns to investors who came in at different times or under different terms.</li>
                        <li>The methodology ensures transparency and fairness, as each investor’s share reflects both the performance of the underlying portfolio and the specific fee structure/expenses applicable to their series.</li>
                    </ul>
                </li>
            </ul>

            <h3>Role of Third-Party Registered Valuers</h3>
            <ul>
                <li><strong>Need for Independent Valuation:</strong>
                    <ul>
                        <li>For illiquid or non‑publicly traded securities, an independent valuation is crucial. This reduces any conflict of interest and ensures that the reported NAV is fair.</li>
                    </ul>
                </li>
                <li><strong>Eligibility Criteria and Responsibilities:</strong>
                    <ul>
                        <li>The independent valuer must not be affiliated with the fund’s manager, sponsor, or trustee.</li>
                        <li>They should have sufficient experience (typically at least 3 years) in valuing unlisted securities and should hold the necessary professional credentials (such as membership in ICAI, ICSI, ICMAI, or CFA Institute, or be registered with IBBI).</li>
                        <li>Their valuation methodologies and inputs must be disclosed to investors as part of the fund’s valuation policy.</li>
                    </ul>
                </li>
            </ul>

            <h3>Key Examples Illustrating Valuation Methods</h3>
            <ul>
                <li><strong>Example 1 – Fund INC NAV Calculation:</strong>
                    <ul>
                        <li>Detailed asset values from multiple categories (listed equities, unlisted equities, unlisted debt, mutual fund units, and cash) are added.</li>
                        <li>Liabilities — including fees payable, administrative expenses, and other charges—are subtracted.</li>
                        <li>The resulting net asset figure is divided by the number of units (e.g., 5,00,000) to arrive at a NAV per unit.</li>
                    </ul>
                </li>
                <li><strong>Example 2 – Mark-to-Market Adjustment:</strong>
                    <ul>
                        <li>A follow-up example of Fund INC uses updated market prices (e.g., lower prices for certain equities due to partial sale, higher prices for others) to recalculate the NAV.</li>
                        <li>The MTM process emphasizes the daily revaluation of derivative positions and elucidates how realized profits from derivatives (reflected by margins) can increase the fund’s NAV.</li>
                    </ul>
                </li>
                <li><strong>Example 3 – Valuation of Illiquid Securities:</strong>
                    <ul>
                        <li>An example demonstrates how an investment in an SME with a daily trading volume constraint will be sold over several days.</li>
                        <li>Each day’s net proceeds are discounted (using a daily cost of capital) to compute a “present value” for the entire block sale.</li>
                        <li>The computed fair value per share is then lower than the observed market price due to liquidity penalties.</li>
                    </ul>
                </li>
                <li><strong>Example 6 – Series NAV Calculation:</strong>
                    <ul>
                        <li>This example breaks down how different classes and series (such as Class A1, A2, B1, etc.) are allocated a proportion of total assets and liabilities.</li>
                        <li>The calculation shows the allocation of expenses and management fees and how the Series NAV per unit is derived.</li>
                    </ul>
                </li>
            </ul>

            <h3>Conclusion</h3>
            <ul>
                <li><strong>Comprehensive Valuation Framework:</strong> Chapter 8 provides the framework and methodologies essential for valuing the diverse assets held by a Category III AIF. Accurate valuation is critical not only for determining investor returns but also for calculating fee structures (like incentive fees based on performance) and ensuring regulatory compliance.</li>
                <li><strong>Transparency and Investor Protection:</strong> By employing daily mark-to-market updates for derivatives, obtaining independent valuations for illiquid assets, and allocating expenses accurately among different unit series, the fund ensures transparency and fairness. This approach also builds investor confidence and aligns with regulatory guidelines.</li>
                <li><strong>Interconnectedness with Other Functions:</strong> The computed NAV – whether at the fund level or segmented by series – plays a vital role in performance benchmarking, fee calculation, and in the measurement of return metrics (both gross and net) reported to investors. In addition, it forms the basis for comparing performance against benchmarks and calculating risk-adjusted return measures.</li>
                <li><strong>Final Thoughts:</strong> Overall, Chapter 8 equips fund managers, investors, and auditors with the necessary tools and insights to understand, compute, and monitor the valuation process in Category III AIFs. The detailed examples and step‑by‑step calculations underscore the importance of robust valuation practices in maintaining integrity and transparency throughout the fund’s operation.</li>
            </ul>
        `
            },


            chapter9: {
                title: "Chapter 9: Taxation of Category III AIFs",
                text: `
            
            <p>This chapter is designed to equip readers with an understanding of the entire tax regime as it applies to Category III Alternative Investment Funds (AIFs). It outlines key differences in tax treatment among AIF categories, the impact of legal structure on tax liabilities, taxability of various income types, the role of Goods and Services Tax (GST), special regimes for International Financial Services Centres (IFSCs), and how taxes influence fund performance and net returns.</p>

            <h3>Learning Objectives</h3>
            <ul>
                <li>Understand the key differences in tax treatment among different AIF categories.</li>
                <li>Learn how the legal structure (trust, company, LLP) affects tax liabilities.</li>
                <li>Identify the taxability of business income, interest, dividends, and capital gains.</li>
                <li>Recognize the impact of Goods and Services Tax (GST) on fee structures.</li>
                <li>Explore special tax regimes applicable to AIFs domiciled in International Financial Services Centres (IFSCs).</li>
                <li>Assess how direct and indirect taxes influence fund performance and net returns.</li>
            </ul>

            <h3>Tax Regime Comparison among AIF Categories</h3>
            <ul>
                <li><strong>Tax Pass-Through Status:</strong>
                    <ul>
                        <li>Unlike Category I and II AIFs, which typically enjoy tax pass-through benefits under Section 115UB, Category III AIFs are not granted such status.</li>
                        <li>Consequently, income generated by Category III AIFs (business income, dividends, capital gains) is taxed at the fund level, and investors bear the tax on distributions when filing their returns.</li>
                    </ul>
                </li>
                <li><strong>Legal Structure Matters:</strong>
                    <ul>
                        <li>Category III AIFs may be registered as trusts, companies, LLPs, or bodies corporate.</li>
                        <li>The chosen structure directly influences the tax treatment and applicable rates (e.g., trusts are generally taxed at the Maximum Marginal Rate, while companies and LLPs are taxed at rates applicable to those entities).</li>
                    </ul>
                </li>
            </ul>

            <h3>Taxation Principles for Trust Structures</h3>
            <ul>
                <li><strong>Determinacy of Beneficiaries:</strong>
                    <ul>
                        <li><strong>Determinate Trusts:</strong> Beneficiaries and their respective interests are clearly defined at the inception of the trust. If structured as such, taxation may be “passed through” so that income is taxed in the hands of the investors, akin to a direct investment.</li>
                        <li><strong>Indeterminate Trusts:</strong> When beneficiary interests are not fixed at inception, the trust (or fund) bears the tax liability on the income earned.</li>
                    </ul>
                </li>
                <li><strong>Revocability:</strong>
                    <ul>
                        <li><strong>Revocable Trusts:</strong> The settlor retains power over the trust and can reclaim assets or income. In these cases, the income is effectively treated as arising to (or for) the settlor.</li>
                        <li><strong>Irrevocable Trusts:</strong> Once established, the trust cannot be unilaterally revoked by the settlor, ensuring that income is fully attributable to the trust’s beneficiaries.</li>
                    </ul>
                </li>
                <li>These distinctions affect how—and by whom—the income is ultimately taxed.</li>
            </ul>

            <h3>Tax Applicability on Income from Category III AIFs</h3>
            <ul>
                <li><strong>Types of Taxable Income:</strong>
                    <ul>
                        <li><strong>Interest Income:</strong> Income from debt instruments (bonds, debentures) is taxable at the investor’s applicable tax rate.</li>
                        <li><strong>Dividend Income:</strong> Following changes in the law (with the withdrawal of the earlier Dividend Distribution Tax regime), dividends received by the AIF are now taxed at the fund level before distribution (subject to specific adjustments such as limited deductibility of dividend collection costs).</li>
                        <li><strong>Capital Gains:</strong>
                            <ul>
                                <li><strong>Listed Securities:</strong> Long-term capital gains on listed shares (with Securities Transaction Tax paid) are taxed at a concessional rate (typically 12.5% on gains above the exemption threshold), while short-term gains are taxed at 20%.</li>
                                <li><strong>Unlisted Securities and Bonds:</strong> Gains here are generally taxed at slab rates applicable to the investor.</li>
                            </ul>
                        </li>
                        <li><strong>Derivatives and Business Income:</strong> Profits generated from derivative transactions (futures, options) are generally treated as business income and taxed at the maximum marginal rate.</li>
                    </ul>
                </li>
                <li><strong>Income Characterization:</strong> The chapter underscores that while the nature of income (whether dividend, interest, or capital gain) remains identical in principle for both the fund and its unit holders, the effective tax burden falls differently depending on the structure and relevant sections of the Income Tax Act.</li>
            </ul>

            <h3>Goods and Services Tax (GST)</h3>
            <ul>
                <li><strong>GST on Service Fees:</strong>
                    <ul>
                        <li>GST is levied at 18% on the management fees, trusteeship fees, and services procured from external providers (such as fund administrators, custodians, legal and audit services).</li>
                        <li>Unlike some other sectors, Category III AIFs do not typically charge GST on the output side. Therefore, the GST paid on input services cannot always be fully recovered, increasing the indirect cost burden on the fund and, ultimately, on its investors.</li>
                    </ul>
                </li>
            </ul>

            <h3>Taxation on Distribution/Redemption of Units</h3>
            <ul>
                <li><strong>Mechanism of Tax Deduction:</strong>
                    <ul>
                        <li>When the fund distributes income or when investors redeem units, these are treated as taxable transfer events.</li>
                        <li>The trustee of the fund is responsible for deducting tax (TDS) at the time of credit or payment in accordance with the provisions of the Income Tax Act.</li>
                        <li>Specific sections (such as Section 194LBB) mandate withholding on dividend distributions and other income, ensuring that tax liabilities are settled before investors receive the net amounts.</li>
                    </ul>
                </li>
                <li><strong>Avoidance of Double Taxation:</strong>
                    <ul>
                        <li>The structure is designed to avoid double taxation by having the fund (or its trustee) handle tax payments on income before it is distributed to investors.</li>
                    </ul>
                </li>
            </ul>

            <h3>Tax Regime for AIFs in IFSCs</h3>
            <ul>
                <li><strong>Preferential Tax Environment:</strong>
                    <ul>
                        <li>AIFs located within an International Financial Services Centre (IFSC) such as GIFT City benefit from a more favorable tax regime.</li>
                        <li><strong>Direct Tax Benefits:</strong>
                            <ul>
                                <li>They may qualify for extended tax holidays (such as a 100% deduction for 10 consecutive years under Section 80LA).</li>
                                <li>Lower Minimum Alternate Tax (MAT) rates (e.g., MAT at 9% instead of the standard rate) are applicable.</li>
                                <li>A flat tax rate may be prescribed, aligning with global standards for offshore funds.</li>
                            </ul>
                        </li>
                        <li><strong>Indirect Tax Benefits:</strong>
                            <ul>
                                <li>IFSC-based AIFs are generally exempt from GST on management fees and related services, which lowers their overall operating costs.</li>
                            </ul>
                        </li>
                        <li><strong>Capital Gains Treatment:</strong>
                            <ul>
                                <li>Gains on the transfer of units and securities (especially offshore investments) may be taxed at favorable rates or even be exempt under specific provisions.</li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li><strong>Non-Resident Investor Incentives:</strong>
                    <ul>
                        <li>Non-resident investors investing in IFSC-domiciled funds enjoy additional benefits, as income and capital gains on offshore investments may be exempt from Indian taxation under relevant Double Tax Avoidance Agreements (DTAAs).</li>
                    </ul>
                </li>
            </ul>

            <h3>Impact of Taxation on Fund Performance</h3>
            <ul>
                <li><strong>Direct vs. Indirect Effects:</strong>
                    <ul>
                        <li>The chapter emphasizes that taxation is not just a compliance subject but also a key determinant of the fund’s net performance.</li>
                        <li>High tax liabilities—whether from income tax on profits, capital gains tax, or indirect taxes like GST—directly lower the net asset value (NAV) and the Internal Rate of Return (IRR) delivered to investors.</li>
                    </ul>
                </li>
                <li><strong>Pre-Tax vs. Post-Tax Returns:</strong>
                    <ul>
                        <li>Detailed examples illustrate the calculation of returns before and after tax, highlighting that even if a fund shows strong gross performance, the net return available to investors can be significantly diminished by tax outlays.</li>
                    </ul>
                </li>
                <li><strong>Strategic Considerations:</strong>
                    <ul>
                        <li>Fund managers and investors are advised to incorporate tax planning within the overall investment strategy (e.g., by choosing an IFSC domicile or by structuring the fund as an irrevocable, determinate trust where feasible) to enhance after-tax returns.</li>
                    </ul>
                </li>
            </ul>

            <h3>Conclusion</h3>
            <ul>
                <li><strong>Integrated Tax Planning:</strong> Chapter 9 underscores the critical importance for both fund managers and investors to understand and manage tax liabilities. The taxation framework for Category III AIFs in India is complex and multifaceted, involving both direct tax (income and capital gains) and indirect tax (GST) components.</li>
                <li><strong>Structure and Strategy Matter:</strong>
                    <ul>
                        <li>The legal form of the fund—whether structured as a trust, company, or LLP—directly affects how income is taxed.</li>
                        <li>Special provisions for funds domiciled in IFSCs can substantially lower the tax burden, thereby improving net returns.</li>
                    </ul>
                </li>
                <li><strong>Investor Implications:</strong>
                    <ul>
                        <li>Since Category III AIFs do not enjoy tax pass-through status, investors effectively bear the tax costs either via lower distributions or through higher fund-level tax payments.</li>
                        <li>Careful due diligence, including a review of tax structuring, should be part of the fund selection process, as tax impacts can materially affect the fund’s performance.</li>
                    </ul>
                </li>
                <li><strong>Overall Impact on Returns:</strong>
                    <ul>
                        <li>A thorough understanding of each element—from how dividends, interest, and capital gains are taxed to the indirect impact of GST—is essential to accurately assess the net return and risk profile of a Category III AIF.</li>
                        <li>By incorporating robust tax planning and transparent reporting, fund managers can ensure that investors receive a fair measure of the fund’s performance after accounting for these tax costs.</li>
                    </ul>
                </li>
            </ul>
        `
            },

            chapter10: {
                title: "Chapter 10: Good Practices",
                text: `
            
            <p>This chapter outlines best practices, procedures, and ethical guidelines that Category III AIFs and their distributors must follow to ensure transparency, investor protection, integrity, and robust operational processes throughout the life cycle of the fund. The key themes include the preparation of confidential pitch materials, the role and responsibilities of distributors before and after an investment is made, strict confidentiality and data privacy requirements, a clearly defined Code of Conduct, and the importance of appropriate insurance coverage for handling risks.</p>

            <h3>Fund Pitch Book: Role and Significance</h3>
            <ul>
                <li><strong>Purpose and Content:</strong>
                    <ul>
                        <li>The pitch book is a confidential document prepared by the Investment Manager after an in‑depth review of the fund’s Private Placement Memorandum (PPM). It is used in private circulation among prospective high net-worth individuals (HNIs), institutional investors, and approved third‑party distributors.</li>
                        <li>It introduces the Fund Sponsor, the Investment Manager, and details the distributor’s role.</li>
                        <li>It presents the investment management team’s profiles; their past track record; and the fund’s historical performance (if available).</li>
                        <li>It explains the proposed investment strategy, including target markets, sectors, investment objectives, allocation, time horizon, risk–return objectives, and any leverage or derivative strategies.</li>
                        <li>It discloses key terms such as fund structure, jurisdiction (including if an offshore fund), tenure, target corpus, investor eligibility, capital commitment details, any investor side letter or co‑investment clauses, and fee structure (including management fees, performance fee mechanics, hurdle rates, catch‑up provisions, etc.).</li>
                        <li>It highlights key risk factors such as those related to portfolio investments, fund structure, regulatory aspects, taxation, sector-specific risks, and currency-related risks.</li>
                    </ul>
                </li>
                <li><strong>Importance:</strong>
                    <ul>
                        <li>A well‑prepared pitch book ensures that potential investors and distributors receive a complete, balanced, and transparent view of the fund. This transparency not only builds trust but also ensures that the investment strategy is appropriate for the investor’s risk–return profile.</li>
                    </ul>
                </li>
            </ul>

            <h3>Role of Distributors: Pre‑investment and Post‑investment Responsibilities</h3>
            <ul>
                <li><strong>Pre‑Investment Services:</strong>

                    options: ["Over the first 12 months from First Close", "Over the first 36 months or the entire fund life from First Close", "Annually until fund dissolution", "Immediately upon fund launch"],
                    correct: "Over the first 36 months or the entire fund life from First Close",

                {

                    options: ["Compliance Risk", "Leverage Risk", "ESG Risk", "Reputational Risk"],
                    correct: "Compliance Risk",
                    explanation: "Compliance Risk involves adhering to stringent SEBI norms, such as Investor Charters, CTR reports, and prudential norms, which can strain Manager resources if not well-equipped, per Section 6.2.3."
                },
                {
                    question: "What is the purpose of the full-trail commission method in Portfolio Management Services (PMS)?",
                    options: ["To charge upfront fees at subscription", "To align the interests of Portfolio Managers, distributors, and investors for long-term investment", "To reduce operating expenses for investors", "To increase Management Fees for Portfolio Managers"],
                    correct: "To align the interests of Portfolio Managers, distributors, and investors for long-term investment",
                    explanation: "The full-trail commission method pays distributors’ commissions quarterly or periodically until the investor exits, ensuring long-term alignment of interests, per Section 6.1.5."
                },
                {
                    question: "Which ESG requirement specifically mandates Category III AIFs to report Stewardship activities to SEBI and clients?",
                    options: ["Limiting leverage in investments", "Following the Stewardship Code for listed equities", "Reporting financial performance quarterly", "Avoiding market-neutral strategies"],
                    correct: "Following the Stewardship Code for listed equities",
                    explanation: "Category III AIFs must follow the Stewardship Code for listed equities since FY 2020-21, requiring periodic reports to SEBI and clients on Stewardship activities, per Section 6.2.3."
                },
                {

                    options: ["It reduces Management Fees", "It allows the Manager to receive a larger share of residual profits quickly", "It lowers the Hurdle Rate", "It caps operating expenses"],
                    correct: "It allows the Manager to receive a larger share of residual profits quickly",
                    explanation: "A high Catch-up Rate (e.g., 100%) enables the Manager to receive all residual profits after investor capital/hurdle until their pre-determined profit share is met, per Section 6.1.4."
                },
                {

                    options: ["It requires a broad-market index like NIFTY 50", "It is not benchmarked against market indices but a fixed rate predetermined by the Manager", "It must use sectoral indices only", "It relies on small-cap indices"],
                    correct: "It is not benchmarked against market indices but a fixed rate predetermined by the Manager",
                    explanation: "Absolute-return strategies aim for returns independent of market movements, using a fixed rate (e.g., 10% p.a.) rather than market indices, making benchmarking challenging, per Section 6.3."

                {
                    question: "Which CAPM assumption might not hold true in real-world Category III AIF investments due to changing market conditions?",
                    options: ["Risk-averse investor behavior", "Constant risk-free return", "Information efficiency among investors", "Perfect competition in the market"],
                    correct: "Constant risk-free return",
                    explanation: "CAPM assumes a constant risk-free return, but returns on government securities may rise or fall, making this assumption unrealistic in real-world conditions, per Section 6.3.1."
                },
                {
                    question: "What is a potential limitation of using Maximum Drawdown (MDD) as a risk measure?",
                    options: ["It measures only positive returns", "It does not indicate how often large losses occur or recovery time", "It quantifies maximum expected gain", "It focuses only on systematic risk"],
                    correct: "It does not indicate how often large losses occur or recovery time",
                    explanation: "MDD measures the largest peak-to-trough decline but does not consider loss frequency or recovery time, per Section 6.2.5.3."
                },
                {
                    question: "How does a negatively skewed return distribution impact investor perception of a Category III AIF?",
                    options: ["It indicates higher potential gains, making it attractive", "It suggests higher risk due to negative outliers, making it less attractive", "It shows a normal distribution with no risk", "It reduces volatility, appealing to risk-averse investors"],
                    correct: "It suggests higher risk due to negative outliers, making it less attractive",
                    explanation: "Negative Skewness indicates a left tail with more negative outliers, suggesting higher risk and making the fund less attractive to investors, per Section 6.2.4.2."
                },
                {
                    question: "What is the role of Benchmarking Agencies in the Category III AIF industry?",
                    options: ["To set Management Fees for all AIFs", "To collect performance data and create industry benchmarks for comparison", "To guarantee returns for investors", "To limit leverage for funds"],
                    correct: "To collect performance data and create industry benchmarks for comparison",
                    explanation: "Benchmarking Agencies, mandated by SEBI, collect performance data from AIFs and create industry benchmarks (e.g., asset-weighted indices) for comparing fund performance, per Section 6.3."
                },
                {
                    question: "True or False: Category III AIFs must report performance data to Benchmarking Agencies only if they have completed at least two years from First Close.",
                    options: ["True", "False"],
                    correct: "False",
                    explanation: "Category III AIFs must report performance data to Benchmarking Agencies if they have completed at least one year from First Close, per Section 6.3 (Box 6.2)."
                },
                {
                    question: "What type of data must Category III AIFs provide to Benchmarking Agencies on March 31 of each year?",
                    options: ["Unaudited data only", "Audited data only", "Both audited and unaudited data", "Pre-tax data only"],
                    correct: "Audited data only",
                    explanation: "Data provided on March 31 must be audited, while September 30 data may be unaudited, per the operational guidelines in Section 6.3 (Box 6.2)."
                },
                {
                    question: "How does a high Standard Deviation impact the perception of a Category III AIF’s risk?",
                    options: ["It indicates lower risk and stability", "It suggests higher volatility and increased risk", "It shows a symmetrical return distribution", "It reduces the need for risk-adjusted metrics"],
                    correct: "It suggests higher volatility and increased risk",
                    explanation: "A high Standard Deviation indicates greater volatility of historical returns from the mean, suggesting increased risk for the fund, per Section 6.2.4.1."
                },
                {
                    question: "What is a potential drawback of using the Treynor Ratio for an undiversified Category III AIF portfolio?",
                    options: ["It overestimates total risk", "It focuses only on systematic risk, not total risk", "It measures maximum drawdown instead of return", "It ignores the risk-free rate"],
                    correct: "It focuses only on systematic risk, not total risk",
                    explanation: "The Treynor Ratio measures excess return per unit of systematic risk (beta), which may not reflect total risk for undiversified portfolios, making the Sharpe Ratio more appropriate, per Section 6.2.5.2."
                }
            ]

        };



        let currentQuizData = [];
        let currentQuestion = 0;
        let score = 0;
        let userAnswers = [];
        let answerSubmitted = false;
        let timerInterval = null;
        let timeLeft = 60; // 60 seconds per question

        // DOM elements
        const summarySelect = document.getElementById('summarySelect');
        const mcqSelect = document.getElementById('mcqSelect');
        const summaryContainer = document.getElementById('summaryContainer');
        const quizContainer = document.getElementById('quizContainer');
        const reviewContainer = document.getElementById('reviewContainer');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const resultEl = document.getElementById('result');
        const scoreEl = document.getElementById('score');
        const progressEl = document.getElementById('progress');
        const progressTextEl = document.getElementById('progressText');
        const timerEl = document.getElementById('timer');
        const reviewContentEl = document.getElementById('reviewContent');

        // Summary selection with HTML formatting
        summarySelect.addEventListener('change', () => {
            const selectedSummary = summarySelect.value;
            quizContainer.style.display = 'none';
            reviewContainer.style.display = 'none';

            if (selectedSummary === '') {
                summaryContainer.style.display = 'none';
            } else {
                summaryContainer.style.display = 'block';
                summaryContainer.innerHTML = `
            <h2>${summaries[selectedSummary].title}</h2>
            ${summaries[selectedSummary].text}
        `;
            }
            mcqSelect.value = ''; // Reset MCQ dropdown
        });


        // MCQ selection (unchanged)
        mcqSelect.addEventListener('change', () => {
            const selectedChapter = mcqSelect.value;
            summaryContainer.style.display = 'none';
            reviewContainer.style.display = 'none';

            if (selectedChapter === '') {
                quizContainer.style.display = 'none';
            } else {
                currentQuizData = quizData[selectedChapter];
                userAnswers = new Array(currentQuizData.length).fill(null);
                currentQuestion = 0;
                score = 0;
                quizContainer.style.display = 'block';
                loadQuestion();
            }
            summarySelect.value = ''; // Reset Summary dropdown
        });

        // Load question (unchanged)
        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 60;
            timerEl.textContent = `Time Left: ${timeLeft}s`;
            startTimer();

            const currentQuiz = currentQuizData[currentQuestion];
            questionEl.textContent = `${currentQuestion + 1}. ${currentQuiz.question}`;
            optionsEl.innerHTML = '';
            answerSubmitted = userAnswers[currentQuestion] !== null && userAnswers[currentQuestion].submitted;

            currentQuiz.options.forEach(option => {
                const optionEl = document.createElement('div');
                optionEl.classList.add('option');
                optionEl.textContent = option;
                if (userAnswers[currentQuestion] && userAnswers[currentQuestion].answer === option) {
                    optionEl.classList.add('selected');
                }
                if (answerSubmitted) {
                    if (option === currentQuiz.correct) {
                        optionEl.classList.add('correct');
                    } else if (option === userAnswers[currentQuestion].answer) {
                        optionEl.classList.add('incorrect');
                    }
                    optionEl.style.pointerEvents = 'none';
                } else {
                    optionEl.addEventListener('click', () => selectAnswer(option, optionEl));
                }
                optionsEl.appendChild(optionEl);
            });

            progressTextEl.textContent = `Question ${currentQuestion + 1} of ${currentQuizData.length}`;
            progressEl.style.width = `${((currentQuestion + 1) / currentQuizData.length) * 100}%`;
            nextBtn.textContent = currentQuestion === currentQuizData.length - 1 ? 'Finish' : 'Next Question';
            prevBtn.disabled = currentQuestion === 0;
            nextBtn.disabled = false;
            scoreEl.textContent = `Score: ${score} / ${currentQuestion + 1}`;
            resultEl.innerHTML = answerSubmitted
                ? `${userAnswers[currentQuestion].answer === currentQuiz.correct ? 'Correct!' : 'Incorrect!'} 
                   The correct answer is: "${currentQuiz.correct}"
                   <div class="explanation">Explanation: ${currentQuiz.explanation}</div>`
                : '';
        }

        // Select answer (unchanged)
        function selectAnswer(option, element) {
            if (answerSubmitted || userAnswers[currentQuestion]) return;

            userAnswers[currentQuestion] = { answer: option, submitted: false };
            const options = optionsEl.children;
            for (let i = 0; i < options.length; i++) {
                options[i].classList.remove('selected');
            }
            element.classList.add('selected');
        }

        // Submit answer and show feedback (unchanged)
        function submitAnswer() {
            const currentQuiz = currentQuizData[currentQuestion];
            if (!userAnswers[currentQuestion]) {
                alert('Please select an answer!');
                return false;
            }

            if (!userAnswers[currentQuestion].submitted) {
                userAnswers[currentQuestion].submitted = true;
                answerSubmitted = true;
                clearInterval(timerInterval);
                const isCorrect = userAnswers[currentQuestion].answer === currentQuiz.correct;
                if (isCorrect && !userAnswers[currentQuestion].counted) {
                    score++;
                    userAnswers[currentQuestion].counted = true;
                }

                const options = optionsEl.children;
                for (let i = 0; i < options.length; i++) {
                    const optionText = options[i].textContent;
                    if (optionText === currentQuiz.correct) {
                        options[i].classList.add('correct');
                    } else if (optionText === userAnswers[currentQuestion].answer && !isCorrect) {
                        options[i].classList.add('incorrect');
                    }
                    options[i].style.pointerEvents = 'none';
                }

                resultEl.innerHTML = `
                    ${isCorrect ? 'Correct!' : 'Incorrect!'} 
                    The correct answer is: "${currentQuiz.correct}"
                    <div class="explanation">Explanation: ${currentQuiz.explanation}</div>
                `;
                scoreEl.textContent = `Score: ${score} / ${currentQuestion + 1}`;
            }
            return true;
        }

        // Timer function (unchanged)
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = `Time Left: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitAnswer();
                }
            }, 1000);
        }

        // Previous button (unchanged)
        prevBtn.addEventListener('click', () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        });

        // Next button (unchanged)
        nextBtn.addEventListener('click', () => {
            if (!answerSubmitted) {
                if (submitAnswer()) {
                    return; // Wait for next click to proceed
                }
            } else if (currentQuestion < currentQuizData.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                showReview();
            }
        });

        // Show review mode (unchanged)
        function showReview() {
            clearInterval(timerInterval);
            quizContainer.style.display = 'none';
            reviewContainer.style.display = 'block';
            reviewContentEl.innerHTML = '';

            currentQuizData.forEach((quiz, index) => {
                const userAnswer = userAnswers[index] ? userAnswers[index].answer : "Not answered";
                const isCorrect = userAnswer === quiz.correct;
                const reviewItem = document.createElement('div');
                reviewItem.classList.add('review-item');
                reviewItem.innerHTML = `
                    <p><strong>Question ${index + 1}:</strong> ${quiz.question}</p>
                    <p><strong>Your Answer:</strong> ${userAnswer} (${isCorrect ? 'Correct' : 'Incorrect'})</p>
                    <p><strong>Correct Answer:</strong> ${quiz.correct}</p>
                    <p><strong>Explanation:</strong> ${quiz.explanation}</p>
                `;
                reviewContentEl.appendChild(reviewItem);
            });

            reviewContentEl.innerHTML += `<p><strong>Final Score:</strong> ${score} out of ${currentQuizData.length} (${Math.round((score / currentQuizData.length) * 100)}%)</p>`;
        }
    </script>
</body>
